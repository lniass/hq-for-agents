<title>HQ Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dispatch board. One column on phones; "Needs you" always first and loudest, other lanes quieter below. */
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --ink: #1d2422;
  --muted: #5d6965;
  --line: #d9ddd8;
  --signal: #b4570e;      /* needs you */
  --signal-soft: #fbeedf;
  --live: #1f6f63;        /* in progress */
  --live-soft: #e2f1ee;
  --ready: #4a5b8c;       /* ready for a worker */
  --ready-soft: #e8ebf5;
  --done: #7b857f;
  --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141917; --panel: #1c2321; --ink: #e6ebe8; --muted: #98a59f; --line: #2e3734;
  --signal: #f0a35e; --signal-soft: #3a2a1b; --live: #6cc4b4; --live-soft: #1b3330;
  --ready: #9fb0e0; --ready-soft: #232a40; --done: #7d8883; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141917; --panel: #1c2321; --ink: #e6ebe8; --muted: #98a59f; --line: #2e3734;
  --signal: #f0a35e; --signal-soft: #3a2a1b; --live: #6cc4b4; --live-soft: #1b3330;
  --ready: #9fb0e0; --ready-soft: #232a40; --done: #7d8883; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }
header { display: grid; gap: 6px; }
h1 { font: 700 1.75rem/1.1 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.status { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--muted); font-size: 0.85rem; }
.status b { color: var(--ink); font-weight: 700; }
.mode { font: 500 0.72rem/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em;
  border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; color: var(--muted); }
.note { color: var(--muted); font-size: 0.9rem; margin: 0; }

section { display: grid; gap: 10px; }
.lane-head { display: flex; align-items: baseline; gap: 10px; }
h2 { font: 700 0.8rem/1 var(--display); text-transform: uppercase; letter-spacing: 0.09em; margin: 0; }
.count { font: 500 0.8rem/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.items { display: grid; gap: 8px; }

.item { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.item h3 { font: 700 1rem/1.3 var(--body); margin: 0; text-wrap: balance; }
.item p { margin: 0; color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font: 400 0.78rem/1.4 var(--mono); color: var(--muted); }
.meta a { color: inherit; }
.meta a:focus-visible, a:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }

/* Lane identity: needs-you is a filled band; the rest only tint the heading. */
.lane-needs h2 { color: var(--signal); }
.lane-needs .item { background: var(--signal-soft); border-color: var(--signal); }
.lane-progress h2 { color: var(--live); }
.lane-progress .item { border-left: 3px solid var(--live); }
.lane-ready h2 { color: var(--ready); }
.lane-done h2 { color: var(--done); }
.lane-done .item { background: transparent; }
.lane-done .item h3 { color: var(--muted); font-weight: 400; }

.empty { color: var(--muted); font-size: 0.9rem; padding: 10px 0; }
.banner { border: 1px dashed var(--line); border-radius: 6px; padding: 14px; color: var(--muted); }
details summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
@media (prefers-reduced-motion: no-preference) { .item { transition: border-color .2s; } }
</style>

<div class="wrap">
  <header>
    <h1>HQ Board</h1>
    <div class="status">
      <span>Last sweep: <b id="sweep">waiting for HQ</b></span>
      <span class="mode" id="mode">observe mode</span>
    </div>
    <p class="note" id="sweep-note">HQ keeps this board current. Items that need your decision appear first.</p>
  </header>

  <div class="banner" id="banner">Loading the board…</div>

  <section class="lane-needs" id="lane-needs_you" hidden>
    <div class="lane-head"><h2>Needs you</h2><span class="count"></span></div>
    <div class="items"></div>
  </section>
  <section class="lane-progress" id="lane-in_progress" hidden>
    <div class="lane-head"><h2>In progress</h2><span class="count"></span></div>
    <div class="items"></div>
  </section>
  <section class="lane-ready" id="lane-ready" hidden>
    <div class="lane-head"><h2>Ready for a worker</h2><span class="count"></span></div>
    <div class="items"></div>
  </section>
  <section class="lane-done" id="lane-done" hidden>
    <details>
      <summary><span class="lane-head" style="display:inline-flex"><h2>Done</h2><span class="count"></span></span></summary>
      <div class="items" style="margin-top:10px"></div>
    </details>
  </section>
</div>

<script>
const LANES = ["needs_you", "in_progress", "ready", "done"];

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function safeUrl(u) {
  try { const x = new URL(u); return x.protocol === "https:" ? x.href : null; } catch { return null; }
}

function renderItems(docs) {
  const byLane = Object.fromEntries(LANES.map(l => [l, []]));
  for (const d of docs) {
    const v = d.data() || {};
    const lane = LANES.includes(v.lane) ? v.lane : "ready";
    byLane[lane].push({ id: d.id, ...v });
  }
  for (const lane of LANES) {
    const rows = byLane[lane].sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")));
    const sec = document.getElementById("lane-" + lane);
    const box = sec.querySelector(".items");
    sec.querySelector(".count").textContent = rows.length;
    box.replaceChildren();
    for (const r of rows) {
      const card = el("article", "item");
      card.append(el("h3", null, r.title || r.id));
      if (r.detail) card.append(el("p", null, r.detail));
      const meta = el("div", "meta");
      if (r.owner) meta.append(el("span", null, "Owner: " + r.owner));
      for (const pr of Array.isArray(r.prs) ? r.prs : []) {
        const href = safeUrl(pr && pr.url);
        if (!href) continue;
        const a = el("a", null, pr.label || "PR");
        a.href = href; a.target = "_blank"; a.rel = "noopener";
        meta.append(a);
      }
      if (r.updatedAt) meta.append(el("span", null, "Updated " + fmtTime(r.updatedAt)));
      if (meta.childNodes.length) card.append(meta);
      box.append(card);
    }
    sec.hidden = rows.length === 0 && lane !== "needs_you";
    if (lane === "needs_you") {
      sec.hidden = false;
      if (!rows.length) box.append(el("p", "empty", "Nothing is waiting on you."));
    }
  }
}

function renderMeta(snap) {
  const v = snap.exists ? snap.data() : null;
  if (!v) return;
  if (v.lastSweep) document.getElementById("sweep").textContent = fmtTime(v.lastSweep);
  if (v.mode) document.getElementById("mode").textContent = v.mode + " mode";
  if (v.note) document.getElementById("sweep-note").textContent = v.note;
}

(async () => {
  const banner = document.getElementById("banner");
  const db = await claude.use("db");
  if (!db) { banner.textContent = "Sign in to claude.ai to see the board."; return; }
  const slow = setTimeout(() => { banner.textContent = "The board can't be reached yet. It will appear when the connection returns."; banner.hidden = false; }, 10000);
  db.collection("items").onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(slow);
    banner.hidden = !snap.empty;
    if (snap.empty) banner.textContent = "No items yet. HQ adds them on its next sweep.";
    renderItems(snap.docs);
  }, err => { clearTimeout(slow); banner.hidden = false; banner.textContent = "The board couldn't load (" + err.code + ")."; });
  db.doc("meta/hq").onSnapshot(renderMeta, () => {});
})();
</script>
